{{ define "main" }}
<div class="mx-auto">
    <!-- Header Section -->
    <div class="mb-8">
        <header class="mb-6">
            <!-- Breadcrumb -->
            {{ partial "breadcrumb.html" . }}
            <h1 class="text-3xl font-semibold">{{ .Title }}</h1>
        </header>
        <div class="text-gray-600">
            {{ .Content }}
        </div>
    </div>

    <!-- Videos Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        {{ range .Site.Data.videos }}
        <div class="group bg-white rounded-xl shadow-md hover:shadow-xl transition-all duration-300 p-4 border border-gray-100 hover:border-blue-200">
            <!-- Video Thumbnail -->
            <div class="flex items-center justify-center h-48 mb-4 bg-gray-50 rounded-lg p-2 group-hover:bg-blue-50 transition-colors duration-300">
                <a href="https://www.youtube.com/watch?v={{ .url }}" target="_blank" rel="noopener">
                    <img src="{{ "images/video-placeholder.png" | relURL }}" alt="{{ .title }}" class="max-h-full max-w-full object-contain">
                </a>
            </div>
            
            <!-- Video Title -->
            <div class="text-center">
                <h2 class="font-semibold text-gray-900 text-lg mb-2 line-clamp-2">
                    <a href="https://www.youtube.com/watch?v={{ .url }}" target="_blank" rel="noopener">{{ .title }}</a>
                </h2>
            </div>
        </div>
        {{ end }}
    </div>
</div>

<style>
/* Line clamp utility for text truncation */
.line-clamp-2 {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
</style>
{{ end }}
