{{ define "main" }}
<div class="mx-auto">
    <!-- Header Section -->
    <div class="mb-8">
        <header class="mb-6">
            <!-- Breadcrumb -->
            {{ partial "breadcrumb.html" . }}
            <h1 class="text-3xl font-semibold font-serif flex items-center gap-3">
                <i class="fa-solid fa-video text-primary"></i>
                <span>{{ .Title }}</span>
            </h1>
        </header>
        <div class="text-gray-600">
            {{ .Content }}
        </div>
    </div>

    <!-- Videos Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        {{ range .Site.Data.videos }}
        <div class="group bg-white rounded-xl shadow-md hover:shadow-xl transition-all duration-300 p-4 border border-gray-100 hover:border-blue-200 flex flex-col justify-between">
            <!-- Video Thumbnail -->
            <div class="relative flex items-center justify-center h-48 mb-4 bg-gray-50 rounded-lg p-2 group-hover:bg-blue-50 transition-colors duration-300 overflow-hidden">
                <a href="https://www.youtube.com/watch?v={{ .url }}" target="_blank" rel="noopener" class="w-full h-full flex items-center justify-center relative">
                    <img src="{{ .thumb | relURL }}" alt="{{ .title }}" class="max-h-full max-w-full object-contain">
                    
                    <!-- Play Overlay Badge -->
                    <span class="absolute inset-0 flex items-center justify-center bg-black/30 opacity-0 group-hover:opacity-100 transition-opacity duration-300 rounded-lg">
                        <i class="fa-solid fa-circle-play text-white text-5xl drop-shadow-lg"></i>
                    </span>
                </a>
            </div>
            
            <!-- Video Title & Meta -->
            <div class="text-center">
                <h2 class="font-semibold text-gray-900 text-lg mb-2 line-clamp-2">
                    <a href="https://www.youtube.com/watch?v={{ .id }}" target="_blank" rel="noopener" class="hover:text-primary transition-colors flex items-center justify-center gap-2">
                        <i class="fa-brands fa-youtube text-red-600 text-xl flex-shrink-0"></i>
                        <span>{{ .title }}</span>
                    </a>
                </h2>
            </div>
        </div>
        {{ end }}
    </div>
</div>

<style>
.line-clamp-2 {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
</style>
{{ end }}
