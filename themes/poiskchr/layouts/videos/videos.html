{{ define "main" }}
<div class="mx-auto">
    <!-- Header Section -->
    <div class="mb-8">
        <header class="mb-6">
            <!-- Breadcrumb -->
            {{ partial "breadcrumb.html" . }}
            <h1 class="text-3xl font-semibold font-serif flex items-center gap-3">
                <i class="fa-solid fa-video text-primary"></i>
                <span>{{ .Title }}</span>
            </h1>
        </header>
        <div class="text-gray-600">
            {{ .Content }}
        </div>
    </div>

    <!-- Videos Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        {{ range .Site.Data.videos }}
        <div class="group bg-white rounded-xl shadow-md hover:shadow-xl transition-all duration-300 p-1 border-4 border-gray-200 hover:border-primary">
            <a href="{{ .video | relURL }}" class="relative block aspect-video rounded-lg overflow-hidden">
                <img src="{{ .thumb | relURL }}" alt="{{ .title }}" loading="lazy" class="w-full h-full object-cover">
                <span class="absolute inset-0 flex items-center justify-center">
                    <i class="fa-solid fa-circle-play text-white text-6xl drop-shadow-lg opacity-90 group-hover:opacity-100 group-hover:scale-110 transition-all duration-300"></i>
                </span>
            </a>
        </div>
        {{ end }}
    </div>
</div>

<style>
.line-clamp-2 {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
</style>
{{ end }}
