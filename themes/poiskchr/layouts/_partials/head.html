  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Поисковое Движение России по Чеченской Республике</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Add font-awesome cdn -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/css/main.css">
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui", "-apple-system", "Segoe UI", "Roboto", "Ubuntu", "Cantarell", "Noto Sans", "Helvetica Neue", "Arial", "Apple Color Emoji", "Segoe UI Emoji"],
            },
            colors: {
              primary: {
                DEFAULT: "#1E5AB8",
              },
              secondary: {
                lightBlue: "#4A90E2",
                creamBeige: "#F5F1E8",
                golden: "#D4A574",
              },
              neutrals: {
                white: "#FFFFFF",
                lightGray: "#F8F9FA",
                textGray: "#333333",
                borderGray: "#E0E0E0",
              },
            },
            boxShadow: {
              vintage: "inset 0 0 0 1px rgba(0,0,0,0.05), 0 10px 25px rgba(0,0,0,0.18)",
              insetPaper: "inset 0 1px 0 rgba(255,255,255,0.6), inset 0 -1px 0 rgba(0,0,0,0.06)",
            },
            backgroundImage: {
              blueTexture:
                "linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 40%), radial-gradient(140% 100% at 10% 0%, #2A6ED5 0%, #1E5AB8 55%, #1A4C97 100%)",
            },
          },
        },
        corePlugins: {
          container: false,
        },
      };
    </script>

    <style>
      /* Page parchment background using layered gradients for an aged look */
      body.paper-bg {
        background-color: #F5F1E8; /* cream beige */
        background-image:
          radial-gradient(120% 100% at 50% 0%, rgba(0,0,0,0.08) 0%, rgba(0,0,0,0) 55%),
          radial-gradient(100% 120% at 100% 0%, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0) 50%),
          radial-gradient(100% 120% at 0% 100%, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0) 50%),
          linear-gradient(180deg, rgba(212,165,116,0.08) 0%, rgba(0,0,0,0.04) 100%);
        background-blend-mode: multiply, normal, normal, normal;
      }

      /* Subtle fold lines across the page */
      .paper-folds::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(90deg, rgba(0,0,0,0.05) 0, rgba(0,0,0,0) 1px),
          linear-gradient(180deg, rgba(0,0,0,0.05) 0, rgba(0,0,0,0) 1px);
        background-size: 320px 1px, 1px 280px;
        background-repeat: repeat;
        mix-blend-mode: multiply;
        opacity: 0.15;
      }

      /* Vintage image frame with subtle corner ornaments */
      .vintage-frame {
        position: relative;
        background-color: #fffdf7;
        border: 6px solid rgba(106, 85, 57, 0.6);
        outline: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow: inset 0 0 0 2px rgba(255,255,255,0.5), 0 12px 25px rgba(0,0,0,0.22);
      }
      .vintage-frame::before,
      .vintage-frame::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(12px 12px at 10px 10px, rgba(106,85,57,0.4) 0 4px, transparent 5px),
          radial-gradient(12px 12px at calc(100% - 10px) 10px, rgba(106,85,57,0.4) 0 4px, transparent 5px),
          radial-gradient(12px 12px at 10px calc(100% - 10px), rgba(106,85,57,0.4) 0 4px, transparent 5px),
          radial-gradient(12px 12px at calc(100% - 10px) calc(100% - 10px), rgba(106,85,57,0.4) 0 4px, transparent 5px);
        opacity: 0.55;
      }
      .vintage-frame::after {
        background:
          radial-gradient(10px 10px at 10px 10px, rgba(255,255,255,0.9) 0 4px, transparent 5px),
          radial-gradient(10px 10px at calc(100% - 10px) 10px, rgba(255,255,255,0.9) 0 4px, transparent 5px),
          radial-gradient(10px 10px at 10px calc(100% - 10px), rgba(255,255,255,0.9) 0 4px, transparent 5px),
          radial-gradient(10px 10px at calc(100% - 10px) calc(100% - 10px), rgba(255,255,255,0.9) 0 4px, transparent 5px);
        mix-blend-mode: screen;
        opacity: 0.5;
      }

      /* Watermark stamps and map lines */
      .artifact-layer svg {
        opacity: 0.12;
        mix-blend-mode: multiply;
        filter: sepia(40%) grayscale(30%);
      }

      /* Collapsible chevron animation */
      .chevron {
        transition: transform 200ms ease;
      }
      .chevron[aria-expanded="true"],
      [aria-expanded="true"] .chevron {
        transform: rotate(90deg);
      }

      /* Off-canvas animation */
      .drawer-enter {
        transform: translateX(-100%);
      }
      .drawer-enter-active {
        transform: translateX(0);
      }

      .space-y-1 > :not([hidden]) ~ :not([hidden]) {
        margin: 0 !important;
      }
    </style>
  </head>
