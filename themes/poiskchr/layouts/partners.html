{{ define "main" }}
<div class="mx-auto">
    <!-- Header Section -->
    <div class="mb-8">
    <header class="mb-6">
        <!-- Breadcrumb -->
        {{ partial "breadcrumb.html" . }}
        <h1 class="text-3xl font-semibold font-serif flex items-center gap-3">
            <i class="fa-solid fa-layer-group text-primary"></i>
            <span>{{ .Title }}</span>
        </h1>
    </header>
        <div class="text-gray-600">
            {{ .Content }}
        </div>
    </div>

    <!-- Partners Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3">
        {{ range .Site.Data.partners }}
        <div class="group rounded-xl shadow-md hover:shadow-xl transition-all duration-300 p-6">
            <!-- Logo Container -->
            <div class="flex items-center justify-center h-32 mb-4 bg-gray-50 rounded-lg p-4 group-hover:bg-blue-50 transition-colors duration-300">
                <img src="{{ .logo }}" alt="{{ .name }}" class="max-h-full max-w-full object-contain">
            </div>
            
            <!-- Content -->
            <div class="text-center">
                <h2 class="font-semibold text-gray-900 text-lg mb-2 line-clamp-2">{{ .name }}</h2>
                {{ with .description }}
                <p class="text-gray-600 text-sm">{{ . }}</p>
                {{ end }}
            </div>
        </div>
        {{ end }}
    </div>
</div>

<style>
/* Line clamp utility for text truncation */
.line-clamp-2 {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

/* Optional: Add animation on scroll if desired */
@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
{{ end }}
