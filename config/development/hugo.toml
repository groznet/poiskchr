# Dev-only (hugo server): serve local ./videos at /videos/ without copying them into production builds.
[[module.mounts]]
  source = "static"
  target = "static"

[[module.mounts]]
  source = "videos"
  target = "static/videos"

[[module.mounts]]
  source = "content"
  target = "content"
[[module.mounts]]
  source = "data"
  target = "data"
[[module.mounts]]
  source = "layouts"
  target = "layouts"
[[module.mounts]]
  source = "i18n"
  target = "i18n"
[[module.mounts]]
  source = "archetypes"
  target = "archetypes"
[[module.mounts]]
  source = "assets"
  target = "assets"
